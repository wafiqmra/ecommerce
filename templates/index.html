<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura's Product  List</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #d0e8f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background-color: #89c2d9;
            color: #2c3e50;
            margin: 0;
            font-size: 2.2em;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 30px;
            gap: 25px;
        }

        .product {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(137, 194, 217, 0.5);
            width: 260px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .product:hover {
            transform: scale(1.05);
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 15px 0 8px;
            color: #2c3e50;
            font-size: 1.2em;
        }

        .product p {
            color: #1e6091;
            font-size: 1.1em;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

<h1>Product Gallery</h1>

<div class="products">
    {% for product in products %}
        <div class="product">
            <img src="{{ product['image_url'] }}" alt="{{ product['name'] }}">
            <h3>{{ product['name'] }}</h3>
            <p>{{ product['price'] }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
